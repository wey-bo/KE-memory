[project]
name = "ke-memory-demo"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.116,<1", "httpx>=0.28,<1", "numpy>=2.2,<3", "openai>=1.93,<2",
  "orjson>=3.10,<4", "pydantic>=2.11,<3", "python-dotenv>=1.1,<2",
  "tiktoken>=0.9,<1",
  "typer>=0.16,<1", "uvicorn>=0.35,<1",
]

[project.scripts]
ke-memory = "ke_memory_demo.cli:app"
ke-memory-serve = "ke_memory_service.api:main"

[dependency-groups]
dev = ["pyright>=1.1.403,<2", "pytest>=8.4,<9", "pytest-asyncio>=1,<2", "respx>=0.22,<1", "ruff>=0.12,<1"]
# Evaluation and conformance only. DuckDB reads the BEAM parquet that source
# replay resolves against, so source validation cannot run without it -- but it
# is an evaluation tool, and the production wheel must not carry it. Kept out of
# [project.dependencies] deliberately: the wheel verifier checks for exactly this
# kind of leak. Pinned rather than ranged so a conformance result names the
# reader version that produced it.
evaluation = ["duckdb==1.5.5"]
# Local embedding only. The same rule as the evaluation group, applied to a much
# larger leak: torch plus its nvidia and triton wheels install 4.5 GB, and no
# module in src, service, ontology, tests or research imports torch at all. It was
# named in [project.dependencies] anyway, so every install of this package pulled a
# CUDA stack the production code never touches -- and a GitHub runner cannot fit it,
# which is what failed the remote gate.
#
# sentence-transformers has exactly one use, a deferred import inside
# embedding/qwen.py::_sentence_transformer_factory that already raises
# EmbeddingInvariantError when the package is absent. So the optional group needs no
# code change: without it, local embedding reports a clear domain error, and
# test_local_embedding.py was already skipped unless KE_MEMORY_EMBEDDING_PATH is set.
embedding = ["sentence-transformers>=5,<6", "torch>=2.7,<3"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "src/ke_memory_demo",
  "service/ke_memory_service",
  "ontology/ke_memory_ontology",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["live_embedding", "live_es", "live_model", "live_baseline", "live_evaluation"]
pythonpath = ["src", "service", "ontology"]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "service", "ontology", "tests"]
extraPaths = ["src", "service", "ontology"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.ruff]
line-length = 100
target-version = "py312"
