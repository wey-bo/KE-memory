name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: genuineknowledge/KEOL
          ref: 44631e64fd07c9b85f22e36035bf49c882dba592
          path: .deps/KEOL
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run repository checks
        env:
          KEOL_SOURCE: ${{ github.workspace }}/.deps/KEOL/src
        run: scripts/ci/check.sh

  # Separate job because the evaluation dependency must not be present when the
  # quality job builds and verifies the wheel: keeping them apart is what proves
  # the production package does not carry an evaluation reader.
  conformance:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install evaluation dependencies
        # --frozen so a drifted lockfile fails here rather than silently
        # resolving a different reader version than the pin declares.
        run: uv sync --frozen --group evaluation
      - name: Verify the evaluation environment contract
        # Fails when the pinned reader is missing or mismatched. Never skips:
        # an unread parquet leaves the source replay path unverified.
        run: scripts/ci/verify_conformance_environment.sh

  container:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ke-memory:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
