name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # KEOL is deliberately not checked out. It is a private repository, so the
      # default token gets a 404 and the step fails before any check has run --
      # which is exactly what happened on the first remote run of this workflow.
      # The remote gate is therefore check-portable.sh, which needs no private
      # dependency. check.sh remains the local entry point and additionally
      # covers the KEOL bridge contract when KEOL_SOURCE is set.
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Split into one step per command, rather than a single call to
      # check-portable.sh. Job logs need admin rights to download, but step
      # conclusions are readable from the public API -- so with named steps a
      # failure says which command failed instead of only "exit code 1". Local
      # reproduction had been exhausted: a shallow clone with an empty dataset
      # root, no KEOL and a cold venv passes here, so the difference is something
      # only the runner sees. Collapse these back into check-portable.sh once the
      # remote is reliably green.
      - name: Sync the locked environment
        run: uv sync --frozen
      - name: Verify repository layout
        run: uv run python scripts/ci/verify_layout.py
      - name: Run tests
        run: uv run pytest -q
      - name: Lint
        run: uv run ruff check src service ontology tests scripts
      - name: Type check
        run: uv run pyright
      - name: Build the distribution
        run: uv build
      - name: Verify the wheel contract
        run: uv run python scripts/ci/verify_wheel.py

  # Separate job because the evaluation dependency must not be present when the
  # quality job builds and verifies the wheel: keeping them apart is what proves
  # the production package does not carry an evaluation reader.
  conformance:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install evaluation dependencies
        # --frozen so a drifted lockfile fails here rather than silently
        # resolving a different reader version than the pin declares.
        run: uv sync --frozen --group evaluation
      - name: Verify the evaluation environment contract
        # Fails when the pinned reader is missing or mismatched. Never skips:
        # an unread parquet leaves the source replay path unverified.
        run: scripts/ci/verify_conformance_environment.sh

  container:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ke-memory:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
