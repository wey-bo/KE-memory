[work]
model = "deepseek-v4-flash"
base_url = "https://api.deepseek.com/v1"
api_key_env = "KE_MEMORY_WORK_API_KEY"
temperature = 0.0
max_output_tokens = 4096
# DeepSeek rejects response_format type json_schema ("This response_format type is
# unavailable now") and accepts json_object.
supports_json_schema = false
# flash is a reasoning model by default and bills reasoning tokens as completion
# tokens. Disabling thinking makes the answer budget predictable: a multi-hop
# supersession question measured 381 completion tokens with thinking (144 reasoning)
# and 193 with thinking disabled, with identical correct output.
disable_thinking = true

[judge]
model = "gpt-5.5"
base_url = "https://api.penguinsaichat.dpdns.org/v1"
api_key_env = "KE_MEMORY_JUDGE_API_KEY"
temperature = 0.0
max_output_tokens = 2048

[embedding]
enabled = false
model = "Qwen/Qwen3-Embedding-0.6B"
revision = "97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3"
local_path_env = "KE_MEMORY_EMBEDDING_PATH"
dimension = 1024
chunk_tokens = 1024
overlap_tokens = 128
local_files_only = true
